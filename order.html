<!DOCTYPE html>
<html lang="tr">
<head>

<link rel="icon" type="image/png" href="assets/images/favicon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sipariş Oluştur | Kae</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/market.css">

</head>

<body>

<div class="bg-glow"></div>

<header class="navbar">

    <a href="index.html" class="logo">K'</a>

    <nav>

        <a href="index.html">Ana Sayfa</a>

        <a href="services.html">Ürünler</a>

    </nav>

</header>

<section class="order-page">

    <div class="order-box">

        <a href="services.html" class="back-btn">
            Geri
        </a>

        <h1>Sipariş Oluştur</h1>

        <label>Platform</label>

        <select id="platform">

            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
            <option value="youtube">YouTube</option>

        </select>

        <label>Hizmet Türü</label>

        <select id="service"></select>

        <div id="usernameBox">

            <label>Kullanıcı Adı / Kanal</label>

            <input
                type="text"
                id="username"
                placeholder="@kullaniciadi">

        </div>

        <div id="linkBox" style="display:none;">

            <label>Gönderi / Video Linki</label>

            <input
                type="text"
                id="link"
                placeholder="https://...">

        </div>

        <label>Miktar</label>

        <input
            type="number"
            id="amount"
            placeholder="1000">

        <label>Not (İsteğe Bağlı)</label>

        <textarea
            id="note"
            placeholder="Varsa sipariş ile ilgili notunuz..."></textarea>

        <label>Toplam Fiyat</label>

        <div class="price-box">

            <span id="price">0 TL</span>

        </div>

        <button id="buyButton" class="buy-btn">

            Siparişi Oluştur

        </button>

    </div>

</section>

<script src="assets/js/script.js"></script>
<script src="assets/js/animations.js"></script>
<script type="module" src="assets/js/order.js"></script>

</body>
</html>
