<!DOCTYPE html>
<html lang="tr">
<head>

<link rel="icon" type="image/png" href="assets/images/favicon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | AizawaKae</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">

</head>

<body>

<div class="bg-grid"></div>

<div class="bg-glow glow-1"></div>

<div class="bg-glow glow-2"></div>

<header class="navbar">

<a href="index.html" class="logo">

<img src="assets/images/logo.png">

<span>AizawaKae</span>

</a>

<nav>

<a href="index.html">

Ana Sayfa

</a>

<button id="logoutBtn" class="login-btn">

Çıkış Yap

</button>

</nav>

</header>

<section class="admin-dashboard">

<aside class="admin-sidebar">

<div class="sidebar-logo">

<img src="assets/images/logo.png">

<h2>

Admin

</h2>

</div>

<div class="sidebar-menu">

<button class="admin-btn active">

📊 Dashboard

</button>

<button class="admin-btn">

📦 Siparişler

</button>

<button class="admin-btn">

👤 Kullanıcılar

</button>

<button class="admin-btn">

💰 Bakiye

</button>

<button class="admin-btn">

⚙ Ayarlar

</button>

</div>

<div class="sidebar-footer">

<span>

AizawaKae 2026

</span>

</div>

</aside>

<main class="admin-main">

<div class="page-header">

<div>

<span>

ADMIN PANEL

</span>

<h1>

Dashboard

</h1>

<p>

Sistemin genel durumu.

</p>

</div>

<div class="admin-online">

<div class="online-dot"></div>

Sistem Aktif

</div>

</div>

<div class="dashboard-cards">

<div class="dashboard-card">

<p>

Toplam Kullanıcı

</p>

<h2 id="totalUsers">

0

</h2>

</div>

<div class="dashboard-card">

<p>

Toplam Sipariş

</p>

<h2 id="totalOrders">

0

</h2>

</div>

<div class="dashboard-card">

<p>

Bekleyen

</p>

<h2 id="pendingOrders">

0

</h2>

</div>

<div class="dashboard-card">

<p>

Tamamlanan

</p>

<h2 id="completedOrders">

0

</h2>

</div>

</div>
<!-- Son Siparişler -->

<section class="admin-section">

<div class="section-header">

<h2>

📦 Son Siparişler

</h2>

<a href="#">

Tümünü Gör

</a>

</div>

<div id="ordersList" class="orders-list">

<!-- admin.js siparişleri buraya ekleyecek -->

</div>

</section>


<!-- Son Kullanıcılar -->

<section class="admin-section">

<div class="section-header">

<h2>

👤 Son Kullanıcılar

</h2>

<a href="#">

Tümünü Gör

</a>

</div>

<div id="usersList" class="users-list">

<!-- admin.js kullanıcıları buraya ekleyecek -->

</div>

</section>


<!-- Bakiye -->

<section class="admin-section">

<div class="section-header">

<h2>

💰 Bakiye Yükle

</h2>

</div>

<div class="balance-panel">

<div class="input-group">

<label>

E-posta

</label>

<input
id="userEmail"
type="email"
placeholder="kullanici@mail.com">

</div>

<div class="input-group">

<label>

Bakiye (₺)

</label>

<input
id="balanceAmount"
type="number"
placeholder="100">

</div>

<button
id="addBalanceBtn"
class="balance-button">

➕ Bakiye Yükle

</button>

</div>

</section>
<!-- Dashboard Footer -->

<footer class="admin-footer">

<div class="footer-left">

© 2026 AizawaKae Admin Panel

</div>

<div class="footer-right">

<span class="status-dot"></span>

Panel Aktif

</div>

</footer>

</main>

</section>

<script src="assets/js/script.js"></script>
<script src="assets/js/animations.js"></script>
<script type="module" src="assets/js/admin.js"></script>

</body>
</html>
